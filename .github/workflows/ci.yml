name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — lint, migrate, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: eqhire
          POSTGRES_PASSWORD: eqhire
          POSTGRES_DB: eqhire_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U eqhire"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://eqhire:eqhire@localhost:5432/eqhire_test
      DATABASE_URL_DIRECT: postgresql://eqhire:eqhire@localhost:5432/eqhire_test

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @equipment-hire/api lint

      - name: Apply migrations
        run: pnpm --filter @equipment-hire/api db:migrate

      - name: Check schema and migrations are in sync
        # Fails if someone edited src/db/schema without generating a migration.
        run: |
          pnpm --filter @equipment-hire/api db:generate
          if [ -n "$(git status --porcelain apps/api/drizzle)" ]; then
            echo "::error::Schema changed but no migration was committed. Run pnpm db:generate."
            git --no-pager diff --stat apps/api/drizzle
            exit 1
          fi

      - name: Test
        run: pnpm --filter @equipment-hire/api test

  frontends:
    name: Customer site and admin panel — lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @equipment-hire/web --filter @equipment-hire/admin lint

      - name: Build
        run: pnpm --filter @equipment-hire/web --filter @equipment-hire/admin build
