# Local development infrastructure.
#   pnpm db:up     start Postgres + Mailpit
#   pnpm db:down   stop them
#   pnpm db:reset  wipe the volume and start clean
services:
  postgres:
    image: postgres:17-alpine
    container_name: eqhire-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: eqhire
      POSTGRES_PASSWORD: eqhire
      POSTGRES_DB: eqhire
      # Keep local collation deterministic so ORDER BY matches production.
      POSTGRES_INITDB_ARGS: '--locale=C.UTF-8 --encoding=UTF8'
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eqhire -d eqhire']
      interval: 5s
      timeout: 5s
      retries: 10

  # Catches every outbound email in development. Web UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: eqhire-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  pgdata:
