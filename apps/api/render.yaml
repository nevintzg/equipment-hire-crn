# Render blueprint. The free web service sleeps after 15 minutes of inactivity
# and cold-starts on the next request; /health is intentionally database-free
# so the health check cannot wake the Neon database.
services:
  - type: web
    name: eqhire-api
    runtime: node
    plan: free
    region: singapore # closest region to Adelaide
    rootDir: apps/api
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm start:prod # runs migrations, then boots
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # Everything below is set in the Render dashboard, not in git.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_DIRECT
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: PUBLIC_WEB_URL
        sync: false
      - key: PUBLIC_ADMIN_URL
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: COOKIE_DOMAIN
        sync: false
      - key: DEFAULT_ORG_SLUG
        value: demo
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
